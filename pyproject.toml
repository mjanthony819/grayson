[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "grayson-converter"
version = "0.1.0"
description = "The zero-click offline file converter for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "M J Anthony" }]
dependencies = [
    "PySide6>=6.6",
    "pynput>=1.7",
    "Pillow>=10",
    "PyMuPDF>=1.24",
    "imageio-ffmpeg>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
grayson = "grayson.cli:main"

[tool.setuptools.packages.find]
include = ["grayson*"]
